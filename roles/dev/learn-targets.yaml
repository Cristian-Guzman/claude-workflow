# learn-targets.yaml — the dev role's contract with core /learn.
# Installed to .claude/learn-targets/dev.yaml. /learn reads every *.yaml in that directory and
# merges them (kinds unioned, targets appended); when the directory is absent it falls back to
# its built-in scan. This file makes the dev behaviour explicit: the two files /learn grows,
# where it logs, where it promotes, and the state kinds it scans for `status: delivered`.
#
# Shape (the contract is documented in core/commands/learn.md §0):
#   kinds             state-file kinds scanned for `status: delivered`, in addition to ticket
#   targets           one entry per project-owned file /learn may append to
#     file            repo-relative path of the knowledge file
#     log_section     H2 ("## ...") where one line per incident is appended;
#                     "" = no log step, the signals are clustered directly
#     lesson_section  H2 for promoted lessons, or "by-category" = the file's own H2 taxonomy
#     promote_at      distinct sources needed before a cluster becomes a lesson (never below 2)
#     compile_to_check  true = a mechanically checkable lesson may also become a hook, lint rule
#                     or script (COMPILE-TO-CHECK, proposed through command-proposals.md)
#     log_only        true = ledger only; never promotes
#     signals         what counts as an incident for this target:
#       {kind, where}        a state-file kind and the section/predicate inside it
#       {diff, add, remove}  a diff-shaped signal over the delivered branch
kinds: [ticket, build, refactor, debug, e2e]

targets:
  - file: .claude/codebase-patterns.md
    log_section: ""
    lesson_section: "by-category"
    promote_at: 2
    compile_to_check: true
    log_only: false
    signals:
      - { kind: ticket,   where: "Event Log: Hit issue / Workaround / Following pattern from" }
      - { kind: ticket,   where: "Review Feedback - Kept / Disagreed" }
      - { kind: ticket,   where: "Decisions Made" }
      - { kind: build,    where: "Event Log" }
      - { kind: refactor, where: "Violations fixed" }
      - { kind: debug,    where: "Root cause" }

  - file: .claude/testing-patterns.md
    log_section: "## E2E drift taxonomy"
    lesson_section: "by-category"
    promote_at: 2
    compile_to_check: false
    log_only: false
    signals:
      - { kind: ticket, where: "Event Log: test-related Hit issue / Workaround" }
      - { kind: ticket, where: "E2E Affected Specs" }
      - { kind: e2e,    where: "Drift class" }
      - { diff: "**/*.spec.*", add: "new spec shape", remove: "retired spec" }
